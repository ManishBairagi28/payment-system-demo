# OpenTelemetry Collector configuration for host metrics
receivers:
  # Host metrics receiver
  hostmetrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk:
        metrics:
          system.disk.io:
            enabled: true
          system.disk.operations:
            enabled: true
          system.disk.io_time:
            enabled: true
          system.disk.merged:
            enabled: true
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      load:
        metrics:
          system.cpu.load_average.1m:
            enabled: true
          system.cpu.load_average.5m:
            enabled: true
          system.cpu.load_average.15m:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network:
        metrics:
          system.network.io:
            enabled: true
          system.network.packets:
            enabled: true
          system.network.errors:
            enabled: true
          system.network.connections:
            enabled: true
      paging:
        metrics:
          system.paging.utilization:
            enabled: true
      processes:
      process:
        metrics:
          process.cpu.utilization:
            enabled: true
          process.memory.utilization:
            enabled: true

  # Docker stats receiver - CHANGE: Removed invalid metrics configuration
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 20s
    api_version: "1.44"
    # CHANGE: Removed metrics section - not supported in this receiver version

  # Prometheus receiver for self-monitoring
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  # Batch processor
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Memory limiter
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource processor to add labels
  resource:
    attributes:
      - key: host.name
        value: docker-host
        action: upsert
      - key: environment
        value: local
        action: upsert
      - key: service.name
        value: host-metrics
        action: upsert

  # Attributes processor for metric labels
  attributes/metrics:
    actions:
      - key: environment
        value: local
        action: upsert
      - key: collector
        value: otel
        action: upsert

exporters:
  # Prometheus exporter
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel
    const_labels:
      environment: local
      collector: opentelemetry
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true

  # Debug exporter for debugging
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    metrics:
      receivers: [hostmetrics, docker_stats, prometheus]
      processors: [memory_limiter, batch, resource, attributes/metrics]
      exporters: [prometheus, debug]

  extensions: [health_check]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133