# Promtail configuration
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: payment-system

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["promtail.logs=true"]
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Extract container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      # Add service label based on container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(payment-service|payment-batch-job).*'
        target_label: 'service'
        replacement: '${1}'
      # Add environment label
      - target_label: 'environment'
        replacement: 'local'
      # Add instance label
      - source_labels: ['__meta_docker_container_name']
        target_label: 'instance'
        regex: '/(.*)'
        replacement: '${1}'
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            thread: thread
            message: message
            traceId: traceId
            spanId: spanId
            paymentId: paymentId
            batchId: batchId
      # Use timestamp from log
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.000Z07:00"
      # Set level label
      - labels:
          level:
          logger:
          thread:
      # Add trace context if available
      - match:
          selector: '{traceId!=""}'
          stages:
            - labels:
                traceId:
      - match:
          selector: '{spanId!=""}'
          stages:
            - labels:
                spanId:
      - match:
          selector: '{paymentId!=""}'
          stages:
            - labels:
                paymentId:
      - match:
          selector: '{batchId!=""}'
          stages:
            - labels:
                batchId:
      # Output the message
      - output:
          source: message

  # Scrape log files directly (alternative approach)
  - job_name: payment-service-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: payment-service
          service: payment-service
          environment: local
          __path__: /logs/payment/payment-service.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            traceId: traceId
            paymentId: paymentId
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.000Z07:00"
      - labels:
          level:
      - output:
          source: message

  - job_name: payment-batch-job-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: payment-batch-job
          service: payment-batch-job
          environment: local
          __path__: /logs/batch/payment-batch-job.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            batchId: batchId
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.000Z07:00"
      - labels:
          level:
      - output:
          source: message
