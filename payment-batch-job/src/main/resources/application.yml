# Payment Batch Job Configuration
spring:
  application:
    name: payment-batch-job

  # Database configuration
  datasource:
    url: jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: payment_user
    password: payment_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: false

# Server configuration (minimal for batch job)
server:
  port: 8081

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        pushgateway:
          enabled: true
          base-url: http://pushgateway:9091
          job: payment-batch-job
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: local

# Logging configuration
logging:
  level:
    root: INFO
    com.example.batch: DEBUG
    org.springframework: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/payment-batch-job.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

# Batch job specific configuration
batch:
  job:
    payment-maintenance:
      enabled: true
      cron: "0 0 2 * * ?" # Run at 2 AM daily
      chunk-size: 1000
      retention-days: 90