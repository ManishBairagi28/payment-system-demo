# Payment Batch Job Configuration
spring:
  application:
    name: payment-batch-job
  
  # Database configuration (same as payment-service)
  datasource:
    url: jdbc:mysql://mysql:3306/payment_db?useSSL=false&amp;allowPublicKeyRetrieval=true&amp;serverTimezone=UTC
    username: payment_user
    password: payment_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  
  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Don't modify schema, just validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        show_sql: false
    open-in-view: false
  
  # Disable web server as this is a batch job
  main:
    web-application-type: none
    banner-mode: off

# Batch job configuration
batch:
  payment:
    stale-hours: 24  # Mark payments as expired after 24 hours

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true
        pushgateway:
          enabled: true
          base-url: http://pushgateway:9091
          job: payment-batch-job
          push-rate: 10s
          shutdown-operation: push
          grouping-key:
            instance: ${HOSTNAME:localhost}
    tags:
      application: ${spring.application.name}
      environment: local

# Logging configuration
logging:
  level:
    root: INFO
    com.example.batch: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - batchId=%X{batchId:-N/A} paymentId=%X{paymentId:-N/A} - %msg%n"
    file: "{\"timestamp\":\"%d{yyyy-MM-dd HH:mm:ss.SSS}\",\"level\":\"%level\",\"thread\":\"%thread\",\"logger\":\"%logger{36}\",\"batchId\":\"%X{batchId:-N/A}\",\"paymentId\":\"%X{paymentId:-N/A}\",\"message\":\"%msg\"}%n"
  file:
    name: /logs/payment-batch-job.log
    max-size: 10MB
    max-history: 7
    total-size-cap: 100MB
