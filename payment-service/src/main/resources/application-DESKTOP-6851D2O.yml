# Payment Service Configuration
spring:
  application:
    name: payment-service

  # Database configuration
  datasource:
    url: jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: payment_user
    password: payment_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Do not set 'hibernate.dialect' (Boot/Hibernate will auto-select MySQLDialect)
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: false

  # RabbitMQ connection (Spring AMQP)
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 30000
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        max-interval: 10000
        multiplier: 2

# Application-level RabbitMQ properties expected by RabbitMQConfig (@Value("${rabbitmq....}"))
rabbitmq:
  exchange:
    payment: ${RABBITMQ_EXCHANGE_PAYMENT:payment.events}
  queue:
    payment-events: ${RABBITMQ_QUEUE_PAYMENT_EVENTS:payment-events-queue}
    payment-events-dlq: ${RABBITMQ_QUEUE_PAYMENT_EVENTS_DLQ:payment-events-dlq}
  routing-key:
    payment-created: ${RABBITMQ_ROUTING_KEY_PAYMENT_CREATED:payment.created}

# Server configuration
server:
  port: 8080
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: local
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s

# Logging configuration
logging:
  level:
    root: INFO
    com.example.payment: DEBUG
    org.springframework.web: INFO
    org.springframework.amqp: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - traceId=%X{traceId:-N/A} spanId=%X{spanId:-N/A} paymentId=%X{paymentId:-N/A} - %msg%n"
    file: "{\"timestamp\":\"%d{yyyy-MM-dd HH:mm:ss.SSS}\",\"level\":\"%level\",\"thread\":\"%thread\",\"logger\":\"%logger{36}\",\"traceId\":\"%X{traceId:-N/A}\",\"spanId\":\"%X{spanId:-N/A}\",\"paymentId\":\"%X{paymentId:-N/A}\",\"message\":\"%msg\"}%n"
  file:
    name: /logs/payment-service.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB